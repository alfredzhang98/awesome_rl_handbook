</style><defs><marker id="rmah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8a5a2b"/></marker></defs><rect width="680" height="1152" fill="#faf9f7"/><rect x="16" y="16" width="648" height="216" rx="12" fill="none" stroke="#d9d5cd" stroke-dasharray="4 4"/><text class="rm-lane" x="30" y="36">STAGE 0 · 马尔可夫决策过程与动态规划</text><a href="ch0.html" class="rm-link"><rect x="30" y="50" width="198" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="129" y="72">第 0 课</text><text class="rm-s" x="129" y="98">值函数与最优值函数</text></a><a href="ch1.html" class="rm-link"><rect x="240" y="50" width="198" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="339" y="72">第 1 课</text><text class="rm-s" x="339" y="98">MDP 与 Bellman 算子</text></a><a href="ch2.html" class="rm-link"><rect x="450" y="50" width="198" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="549" y="72">第 2 课</text><text class="rm-s" x="549" y="98">动态规划</text></a><path class="rm-e" d="M228 80 L240 80" marker-end="url(#rmah)"/><path class="rm-e" d="M438 80 L450 80" marker-end="url(#rmah)"/><a href="ch3.html" class="rm-link"><rect x="30" y="148" width="304" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="182" y="170">第 3 课</text><text class="rm-s" x="182" y="196">蒙特卡罗与时序差分</text></a><rect x="346" y="148" width="304" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="498" y="170">第 4 课</text><text class="rm-s" x="498" y="196">SARSA：on-policy 控制</text><path class="rm-e" d="M549 110 L549 129 L182 129 L182 148" marker-end="url(#rmah)"/><path class="rm-e" d="M334 178 L346 178" marker-end="url(#rmah)"/><rect x="16" y="258" width="648" height="412" rx="12" fill="none" stroke="#d9d5cd" stroke-dasharray="4 4"/><text class="rm-lane" x="30" y="278">STAGE 1 · off-policy 与深度价值方法</text><rect x="30" y="292" width="620" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="340" y="314">① Q-learning 与 off-policy</text><text class="rm-s" x="340" y="340">把目标里的 a′ 换成 max</text><rect x="30" y="368" width="620" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="340" y="390">② 多步方法与重要性采样</text><text class="rm-s" x="340" y="416">n-step / TD(λ) / 资格迹 / Dyna</text><rect x="30" y="444" width="620" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="340" y="466">③ 值函数逼近</text><text class="rm-s" x="340" y="492">从表格到神经网络：稳定性为什么会丢</text><rect x="30" y="520" width="620" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="340" y="542">④ DQN 家族</text><text class="rm-s" x="340" y="568">replay · target network · Double</text><path class="rm-e" d="M340 352 L340 368" marker-end="url(#rmah)"/><path class="rm-e" d="M340 428 L340 444" marker-end="url(#rmah)"/><path class="rm-e" d="M340 504 L340 520" marker-end="url(#rmah)"/><rect x="30" y="604" width="147" height="52" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="103" y="626">Double</text><text class="rm-s" x="103" y="644">修 max 的偏差</text><rect x="187" y="604" width="147" height="52" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="260" y="626">Dueling</text><text class="rm-s" x="260" y="644">拆成 V + A</text><rect x="344" y="604" width="147" height="52" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="417" y="626">Prioritized Replay</text><text class="rm-s" x="417" y="644">按 TD-error 采样</text><rect x="501" y="604" width="147" height="52" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="574" y="626">Rainbow / 分布型</text><text class="rm-s" x="574" y="644">合并 · 学整个分布</text><path class="rm-e" d="M340 580 L340 602" marker-end="url(#rmah)"/><rect x="16" y="696" width="648" height="296" rx="12" fill="none" stroke="#d9d5cd" stroke-dasharray="4 4"/><text class="rm-lane" x="30" y="716">STAGE 2 · 策略梯度方法</text><rect x="30" y="728" width="290" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="175" y="750">策略梯度 REINFORCE</text><text class="rm-s" x="175" y="776">直接优化 π(a|s)</text><rect x="336" y="728" width="290" height="60" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="481" y="750">Actor-Critic</text><text class="rm-s" x="481" y="776">actor 出策略，critic 降方差</text><path class="rm-e" d="M320 758 L336 758" marker-end="url(#rmah)"/><rect x="30" y="814" width="190" height="52" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="125" y="836">A2C / A3C</text><text class="rm-s" x="125" y="854">并行采样</text><rect x="236" y="814" width="190" height="52" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="331" y="836">TRPO → PPO → GRPO</text><text class="rm-s" x="331" y="854">信任域：别走太远</text><rect x="442" y="814" width="190" height="52" rx="9" fill="#ffffff" stroke="#8a5a2b"/><text class="rm-t main" x="537" y="836">DDPG → TD3 → SAC</text><text class="rm-s" x="537" y="854">连续控制 · off-policy</text><path class="rm-e" d="M481 788 L481 801 L125 801 L125 814" marker-end="url(#rmah)"/><path class="rm-e" d="M481 788 L481 801 L331 801 L331 814" marker-end="url(#rmah)"/><path class="rm-e" d="M481 788 L481 801 L537 801 L537 814" marker-end="url(#rmah)"/><rect x="30" y="888" width="596" height="56" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="328" y="910">三支各解决什么</text><text class="rm-s" x="328" y="932">并行提吞吐 · 信任域保稳定 · 确定性策略进连续动作</text><rect x="16" y="1018" width="648" height="118" rx="12" fill="none" stroke="#d9d5cd" stroke-dasharray="4 4"/><text class="rm-lane" x="30" y="1038">STAGE 3–5 · 进阶主题</text><rect x="30" y="1052" width="198" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="129" y="1074">Stage 3 · 模仿学习</text><text class="rm-s" x="129" y="1100">从示范里学，奖励难写时</text><rect x="240" y="1052" width="198" height="60" rx="9" fill="#ffffff" stroke="#e5e2dc"/><text class="rm-t" x="339" y="1074">Stage 4 · 离线 RL</text><text c