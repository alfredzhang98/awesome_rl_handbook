<svg viewBox="0 0 680 946" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="值函数家族关系图：回报、策略、状态价值、动作价值、优势、Bellman 期望方程、最优值函数、最优策略"><defs><style>text{text-anchor:middle;dominant-baseline:middle;font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bx{fill:#faf9f7;stroke:#e5e2dc;stroke-width:1}.bx.hi{fill:#f3ece3;stroke:#8a5a2b;stroke-width:1.4}.t{fill:#1c1b19;font-size:13.5px;font-weight:700}.f{fill:#1c1b19;font-size:12px;font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif}.d{fill:#7d7a73;font-size:11px}.ln{stroke:#8a5a2b;stroke-width:1.6;fill:none}.ln.dash{stroke:#e5e2dc;stroke-width:1.4;stroke-dasharray:4 3}.el{fill:#7d7a73;font-size:10.5px}.el.em{fill:#8a5a2b;font-weight:600}.el.l{text-anchor:end}.el.r{text-anchor:start}</style><marker id="vfa" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a5a2b"/></marker></defs><rect class="bx hi" x="180" y="40" width="320" height="92" rx="10"/><text class="t" x="340" y="61">回报 G<tspan dy="4" font-size="8.5">t</tspan></text><text class="f" x="340" y="83">G<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"> = Σ</tspan><tspan dy="4" font-size="8.5">k</tspan><tspan dy="-4"> γ</tspan><tspan dy="-5" font-size="8.5">k</tspan><tspan dy="5">R</tspan><tspan dy="4" font-size="8.5">t+k+1</tspan></text><text class="d" x="340" y="103">从这一刻起，往后所有奖励打折加起来。</text><text class="d" x="340" y="118">走一条轨迹得一个数——它是样本，不是估计</text><rect class="bx hi" x="180" y="172" width="320" height="92" rx="10"/><text class="t" x="340" y="193">策略 π(a|s)</text><text class="f" x="340" y="215">Σ<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"> π(a|s) = 1</tspan></text><text class="d" x="340" y="235">在状态 s 时该怎么挑动作。</text><text class="d" x="340" y="250">环境是给定的，它是你唯一能改的东西</text><rect class="bx" x="20" y="304" width="300" height="92" rx="10"/><text class="t" x="170" y="325">状态价值 V<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s)</tspan></text><text class="f" x="170" y="347">E<tspan dy="4" font-size="8.5">π</tspan><tspan dy="-4">[ G</tspan><tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"> | S</tspan><tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4">=s ]</tspan></text><text class="d" x="170" y="367">站在 s，此后一直照 π 走，</text><text class="d" x="170" y="382">平均能拿多少</text><rect class="bx" x="360" y="304" width="300" height="92" rx="10"/><text class="t" x="510" y="325">动作价值 Q<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s,a)</tspan></text><text class="f" x="510" y="347">E<tspan dy="4" font-size="8.5">π</tspan><tspan dy="-4">[ G</tspan><tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"> | S</tspan><tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4">=s, A</tspan><tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4">=a ]</tspan></text><text class="d" x="510" y="367">站在 s，这一步先走 a，</text><text class="d" x="510" y="382">之后才照 π 走，平均能拿多少</text><rect class="bx" x="150" y="436" width="380" height="92" rx="10"/><text class="t" x="340" y="457">优势 A<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s,a)</tspan></text><text class="f" x="340" y="479">A<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s,a) = Q</tspan><tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s,a) − V</tspan><tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s)</tspan></text><text class="d" x="340" y="499">在状态 s 下选动作 a，相比于「按当前策略正常发挥」，</text><text class="d" x="340" y="514">到底好多少。按策略平均必然等于 0</text><rect class="bx" x="100" y="568" width="480" height="92" rx="10"/><text class="t" x="340" y="589">Bellman 期望方程</text><text class="f" x="340" y="611">V<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s) = Σ</tspan><tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"> π(a|s) Σ</tspan><tspan dy="4" font-size="8.5">s′</tspan><tspan dy="-4"> P(s′|s,a) [ R + γV</tspan><tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5">(s′) ]</tspan></text><text class="d" x="340" y="631">把无穷长的和改写成「这一步 + 下一格的值」。</text><text class="d" x="340" y="646">定义只能拿来理解，方程才能拿来计算</text><rect class="bx hi" x="100" y="700" width="480" height="92" rx="10"/><text class="t" x="340" y="721">最优值函数 V⋆ / Q⋆</text><text class="f" x="340" y="743">V⋆(s) = max<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"> [ R + γ Σ</tspan><tspan dy="4" font-size="8.5">s′</tspan><tspan dy="-4"> P(s′|s,a) V⋆(s′) ]</tspan></text><text class="d" x="340" y="763">所有走法里最好的那一种能拿多少。</text><text class="d" x="340" y="778">与上式只差一处：Σ<tspan dy="3" font-size="7.5">a</tspan><tspan dy="-3">π 换成 max</tspan><tspan dy="3" font-size="7.5">a</tspan><tspan dy="-3">，于是变成非线性</tspan></text><rect class="bx hi" x="180" y="832" width="320" height="92" rx="10"/><text class="t" x="340" y="853">最优策略 π⋆</text><text class="f" x="340" y="875">π⋆(s) = argmax<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"> Q⋆(s,a)</tspan></text><text class="d" x="340" y="895">有了 Q⋆，选动作只剩「这一行里挑最大」。</text><text class="d" x="340" y="910">max 取的是值，argmax 取的是动作</text><path class="ln" d="M340,132 V172" marker-end="url(#vfa)"/><text class="el r" x="348" y="152">要先说清按谁的走法算</text><path class="ln" d="M340,264 V284 H170 V304" marker-end="url(#vfa)"/><text class="el l" x="162" y="294">对 G 取期望</text><path class="ln" d="M340,264 V284 H510 V304" marker-end="url(#vfa)"/><text class="el r" x="518" y="294">多钉死第一步</text><path class="ln dash" d="M170,396 V416 H230 V436" marker-end="url(#vfa)"/><text class="el l" x="162" y="406">当基准</text><path class="ln dash" d="M510,396 V416 H450 V436" marker-end="url(#vfa)"/><text class="el r" x="518" y="406">相减</text><path class="ln" d="M340,528 V568" marker-end="url(#vfa)"/><text class="el r" x="348" y="548">展开一步，写成递推</text><path class="ln em" d="M340,660 V700" marker-end="url(#vfa)"/><text class="el r em" x="348" y="680">Σ<tspan dy="3" font-size="7.5">a</tspan><tspan dy="-3">π 换成 max</tspan><tspan dy="3" font-size="7.5">a</tspan></text><path class="ln" d="M340,792 V832" marker-end="url(#vfa)"/><text class="el r" x="348" y="812">取 argmax</text></svg>