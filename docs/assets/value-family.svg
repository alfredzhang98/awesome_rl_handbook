<svg viewBox="0 0 680 890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="值函数家族关系图：回报、策略、状态价值、动作价值、优势、Bellman 期望方程、最优值函数、最优策略"><defs><style>text{text-anchor:middle;dominant-baseline:middle;font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}.bx{fill:#faf9f7;stroke:#e5e2dc;stroke-width:1}.bx.hi{fill:#f3ece3;stroke:#8a5a2b;stroke-width:1.4}.t{fill:#1c1b19;font-size:13.5px;font-weight:700}.f{fill:#1c1b19;font-size:12px;font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif}.d{fill:#7d7a73;font-size:11px}.ln{stroke:#8a5a2b;stroke-width:1.6;fill:none}.ln.dash{stroke:#e5e2dc;stroke-width:1.4;stroke-dasharray:4 3}.el{fill:#7d7a73;font-size:10.5px}.el.em{fill:#8a5a2b;font-weight:600}</style><marker id="vfa" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a5a2b"/></marker></defs><rect class="bx hi" x="180" y="40" width="320" height="84" rx="10"/><text class="t" x="340" y="61">回报 G<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan></text><text class="f" x="340" y="81">G<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan> = Σ<tspan dy="4" font-size="8.5">k</tspan><tspan dy="-4"></tspan> γ<tspan dy="-5" font-size="8.5">k</tspan><tspan dy="5"></tspan>R<tspan dy="4" font-size="8.5">t+k+1</tspan><tspan dy="-4"></tspan></text><text class="d" x="340" y="100">从这一刻起，往后所有奖励打折加起来。</text><text class="d" x="340" y="114">走一条轨迹得一个数——它是样本，不是估计</text><rect class="bx hi" x="180" y="164" width="320" height="84" rx="10"/><text class="t" x="340" y="185">策略 π(a|s)</text><text class="f" x="340" y="205">Σ<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"></tspan> π(a|s) = 1</text><text class="d" x="340" y="224">在状态 s 时该怎么挑动作。</text><text class="d" x="340" y="238">环境是给定的，它是你唯一能改的东西</text><rect class="bx" x="20" y="288" width="300" height="84" rx="10"/><text class="t" x="170" y="309">状态价值 V<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s)</text><text class="f" x="170" y="329">E<tspan dy="4" font-size="8.5">π</tspan><tspan dy="-4"></tspan>[ G<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan> | S<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan>=s ]</text><text class="d" x="170" y="348">站在 s，此后一直照 π 走，</text><text class="d" x="170" y="362">平均能拿多少</text><rect class="bx" x="360" y="288" width="300" height="84" rx="10"/><text class="t" x="510" y="309">动作价值 Q<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s,a)</text><text class="f" x="510" y="329">E<tspan dy="4" font-size="8.5">π</tspan><tspan dy="-4"></tspan>[ G<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan> | S<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan>=s, A<tspan dy="4" font-size="8.5">t</tspan><tspan dy="-4"></tspan>=a ]</text><text class="d" x="510" y="348">站在 s，这一步先走 a，</text><text class="d" x="510" y="362">之后才照 π 走，平均能拿多少</text><rect class="bx" x="150" y="412" width="380" height="84" rx="10"/><text class="t" x="340" y="433">优势 A<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s,a)</text><text class="f" x="340" y="453">A<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s,a) = Q<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s,a) − V<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s)</text><text class="d" x="340" y="472">在状态 s 下选动作 a，相比于「按当前策略正常发挥」，</text><text class="d" x="340" y="486">到底好多少。按策略平均必然等于 0</text><rect class="bx" x="100" y="536" width="480" height="84" rx="10"/><text class="t" x="340" y="557">Bellman 期望方程</text><text class="f" x="340" y="577">V<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s) = Σ<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"></tspan> π(a|s) Σ<tspan dy="4" font-size="8.5">s′</tspan><tspan dy="-4"></tspan> P(s′|s,a) [ R + γV<tspan dy="-5" font-size="8.5">π</tspan><tspan dy="5"></tspan>(s′) ]</text><text class="d" x="340" y="596">把无穷长的和改写成「这一步 + 下一格的值」。</text><text class="d" x="340" y="610">定义只能拿来理解，方程才能拿来计算</text><rect class="bx hi" x="100" y="660" width="480" height="84" rx="10"/><text class="t" x="340" y="681">最优值函数 V⋆ / Q⋆</text><text class="f" x="340" y="701">V⋆(s) = max<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"></tspan> [ R + γ Σ<tspan dy="4" font-size="8.5">s′</tspan><tspan dy="-4"></tspan> P(s′|s,a) V⋆(s′) ]</text><text class="d" x="340" y="720">所有走法里最好的那一种能拿多少。</text><text class="d" x="340" y="734">与上式只差一处：Σ_a π 换成 max_a，于是变成非线性</text><rect class="bx hi" x="180" y="784" width="320" height="84" rx="10"/><text class="t" x="340" y="805">最优策略 π⋆</text><text class="f" x="340" y="825">π⋆(s) = argmax<tspan dy="4" font-size="8.5">a</tspan><tspan dy="-4"></tspan> Q⋆(s,a)</text><text class="d" x="340" y="844">有了 Q⋆，选动作只剩「这一行里挑最大」。</text><text class="d" x="340" y="858">max 取的是值，argmax 取的是动作</text><path class="ln" d="M340,124 V164" marker-end="url(#vfa)"/><text class="el" x="340" y="148">要先说清按谁的走法算</text><path class="ln" d="M340,248 V268 H170 V288" marker-end="url(#vfa)"/><text class="el" x="168" y="282">对 G 取期望</text><path class="ln" d="M340,248 V268 H510 V288" marker-end="url(#vfa)"/><text class="el" x="512" y="282">多钉死第一步</text><path class="ln dash" d="M170,372 V392 H230 V412" marker-end="url(#vfa)"/><text class="el" x="150" y="406">当基准</text><path class="ln dash" d="M510,372 V392 H450 V412" marker-end="url(#vfa)"/><text class="el" x="530" y="406">相减</text><path class="ln" d="M340,496 V536" marker-end="url(#vfa)"/><text class="el" x="340" y="520">展开一步，写成递推</text><path class="ln em" d="M340,620 V660" marker-end="url(#vfa)"/><text class="el em" x="340" y="644">Σₐπ 换成 maxₐ</text><path class="ln" d="M340,744 V784" marker-end="url(#vfa)"/><text class="el" x="340" y="768">取 argmax</text></svg>